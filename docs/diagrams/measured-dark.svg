<title>One OS build, two Macs</title>
<desc>One OS build, 26A434, on two Macs, warm, three repeats for most cases. 48 checks: 43 unchanged, 4 pass only on the M1, and 1 passes less on the M1. intent-renewal-risk: M4 0 of 3, M1 3 of 3. intent-billing-question: M4 0 of 3, M1 3 of 3. deal-owning-specialist: M4 0 of 3, M1 3 of 3. status-summary format: M4 0 of 1, M1 1 of 1. facts-absent fail-closed: M4 3 of 3, M1 2 of 3. The model variants differ (M4 sparse_16, M1 14.4), so this records two Macs, not a regression.</desc>
