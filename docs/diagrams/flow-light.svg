<svg viewBox="0 0 360 648" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>How septdrift catches drift</title>
<desc>You declare cases with checks in cases/*.yaml. septdrift run sends each case to the on-device model and writes a hash-chained recording whose header names the chip, OS build, and model asset IDs. Record once before an OS update and once after, or on two Macs. septdrift diff scores both recordings check by check and classes each as flip, degrade, fix, or unchanged. It exits 0 when nothing flipped and 1 when a check that passed now fails.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="648" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>How septdrift catches drift</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<rect x="16" y="56" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#23749E" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Cases: cases/*.yaml</text>
<text x="180" y="97" font-size="12" fill="#6A625A" text-anchor="middle">prompt, instructions, checks</text>
<path d="M180 112 L180 150" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,142 185,142 180,150" fill="#6A625A"/>
<rect x="16" y="154" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="177" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">septdrift run</text>
<text x="180" y="195" font-size="12" fill="#6A625A" text-anchor="middle">on-device model or fixtures</text>
<text x="180" y="211" font-size="12" fill="#2B2926" text-anchor="middle">hash-chained recording</text>
<path d="M180 226 L180 264" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,256 185,256 180,264" fill="#6A625A"/>
<rect x="16" y="268" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#23749E" stroke-width="1.5"/>
<text x="180" y="291" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Recording A, recording B</text>
<text x="180" y="309" font-size="12" fill="#6A625A" text-anchor="middle">before and after an update,</text>
<text x="180" y="325" font-size="12" fill="#2B2926" text-anchor="middle">or two Macs</text>
<path d="M180 340 L180 378" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,370 185,370 180,378" fill="#6A625A"/>
<rect x="16" y="382" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#23749E" stroke-width="1.5"/>
<text x="180" y="405" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">septdrift diff A B</text>
<text x="180" y="423" font-size="12" fill="#6A625A" text-anchor="middle">pass rate per check, then</text>
<text x="180" y="439" font-size="12" fill="#2B2926" text-anchor="middle">flip, degrade, fix, unchanged</text>
<path d="M94 454 L94 500" fill="none" stroke="#33703F" stroke-width="2"/><polygon points="89,492 99,492 94,500" fill="#33703F"/>
<path d="M266 454 L266 500" fill="none" stroke="#90302B" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="261,492 271,492 266,500" fill="#90302B"/>
<rect x="16" y="502" width="156" height="70" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="94" y="525" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">exit 0</text>
<text x="94" y="543" font-size="12" fill="#6A625A" text-anchor="middle">no check flipped</text>
<rect x="188" y="502" width="156" height="70" rx="5" fill="#EBE6DD" stroke="#90302B" stroke-width="1.5"/>
<text x="266" y="525" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">exit 1</text>
<text x="266" y="543" font-size="12" fill="#6A625A" text-anchor="middle">a check that passed</text>
<text x="266" y="559" font-size="12" fill="#6A625A" text-anchor="middle">now fails</text>
<text x="16" y="598" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>The hash chain is unsigned: verify proves a recording is</text>
<text x="16" y="615" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>whole, not where it came from.</text>
</svg>
